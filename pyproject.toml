[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bass-system"
version = "1.0.0"
description = "Bass 1.0 极简通用工业机器人软控制器、Web 示教器与 MuJoCo 4.0 物理仿真一体化系统"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mujoco>=4.0.0",
    "numpy>=1.24",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "websockets>=12.0",
]

[tool.setuptools]
package-dir = { "bass_sim" = "runtime/sim" }
packages = ["bass_sim"]

[tool.pytest.ini_options]
pythonpath = ["runtime"]
testpaths = ["src/tests"]
addopts = "-v --tb=short"
