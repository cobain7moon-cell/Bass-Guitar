[workspace]
resolver = "2"
members = [
    "crates/bass-types",
    "crates/bass-motion",
    "crates/bass-hal",
    "crates/bass-logger",
    "crates/bass-compiler",
    "crates/bass-interpreter",
    "crates/bass-proto",
    "crates/bass-motion-engine",
    "crates/bass-runtime",
]

[workspace.package]
edition = "2021"
version = "1.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
nalgebra = "0.33"
rhai = { version = "1.20", features = ["sync", "internals", "debugging"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["http1", "http2", "json"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
tonic = "0.14.9"
tonic-web = "0.14.9"
tonic-prost = "0.14.9"
tonic-prost-build = "0.14.9"
prost = "0.14.6"
tokio-stream = "0.1"
async-trait = "0.1"
